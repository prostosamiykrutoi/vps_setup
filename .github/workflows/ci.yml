name: ci

on:
  push:
    branches: [claude/shroud-orchestrator]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: pip install -e '.[test]'
      - name: Lint (compile) + unit tests
        run: |
          python -m compileall -q shroud
          bash -n bootstrap/setup.sh
          python -m pytest -q

  integration:
    # Real proxy stack on the runner: image pulls, docker compose up, 3x-ui API.
    # Host hardening + firewall are intentionally NOT exercised here (they could
    # cut off the runner); those are validated on a real VPS.
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          # ci_integration.py + paths.py expect the checkout at /opt/shroud.
          path: shroud-src
      - name: Stage checkout at /opt/shroud
        run: |
          sudo mkdir -p /opt/shroud
          sudo cp -a "$GITHUB_WORKSPACE/shroud-src/." /opt/shroud/
      - name: Create venv + install (mirrors bootstrap/setup.sh)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv
          sudo python3 -m venv /opt/shroud/.venv
          sudo /opt/shroud/.venv/bin/pip install --quiet --upgrade pip
          sudo /opt/shroud/.venv/bin/pip install --quiet -e /opt/shroud
      - name: Show docker + compose versions
        run: |
          docker --version
          docker compose version
      - name: Run integration driver
        run: sudo /opt/shroud/.venv/bin/python /opt/shroud/tests/ci_integration.py
