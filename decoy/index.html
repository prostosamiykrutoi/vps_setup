<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Analytics — Status</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           margin: 0; background: #f7f8fa; color: #222; }
    header { background: #1f2937; color: #fff; padding: 18px 24px; }
    main { max-width: 720px; margin: 40px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
            padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .ok { color: #15803d; font-weight: 600; }
    footer { color: #6b7280; font-size: 13px; text-align: center; margin: 32px 0; }
  </style>
</head>
<body>
  <header><strong>Northwind Analytics</strong></header>
  <main>
    <div class="card">
      <h1>Service status</h1>
      <p>All systems <span class="ok">operational</span>.</p>
      <p>This endpoint serves the Northwind Analytics dashboard. If you reached
         this page directly, please sign in through your organisation portal.</p>
      <p>For support, contact your account administrator.</p>
    </div>
    <footer>© Northwind Analytics. All rights reserved.</footer>
  </main>
</body>
</html>
